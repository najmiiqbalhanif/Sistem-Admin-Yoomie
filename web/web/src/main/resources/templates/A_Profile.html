<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoomie Admin - Profile</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <!-- Pakai CSS dashboard yang sama biar warna & font konsisten -->
  <link rel="stylesheet" th:href="@{/css/A_dashboard.css}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">
</head>
<body class="dashboard-body">

<div class="dashboard-wrapper">

  <!-- SIDEBAR (sama dengan dashboard, supaya masih berasa di dalam app) -->
  <aside id="sidebar" class="dashboard-sidebar">
    <div class="sidebar-header">
      <span class="sidebar-brand">Yoomie Admin</span>
    </div>

    <nav class="sidebar-menu">
      <p class="dashboard-link" onclick="window.location.href='/A_dashboard'">
        <span class="sidebar-icon">🏠</span>
        <span>Dashboard</span>
      </p>
      <p class="dashboard-link" onclick="window.location.href='/A_dashboard#transaction'">
        <span class="sidebar-icon">🧾</span>
        <span>Transaction</span>
      </p>
      <p class="dashboard-link" onclick="window.location.href='/A_dashboard#library'">
        <span class="sidebar-icon">📚</span>
        <span>Library</span>
      </p>
      <p class="dashboard-link">
        <span class="sidebar-icon">📊</span>
        <span>Reports</span>
      </p>
      <p class="dashboard-link">
        <span class="sidebar-icon">💬</span>
        <span>Reviews</span>
      </p>
      <p class="dashboard-link">
        <span class="sidebar-icon">👨‍💻</span>
        <span>Cashier</span>
      </p>
    </nav>

    <div class="sidebar-footer">
      <small>© 2025 Yoomie</small>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <main class="dashboard-main">

    <!-- TOPBAR (re-use dari dashboard) -->
    <header class="dashboard-topbar">
      <div class="topbar-left">
        <span class="topbar-app-name">Yoomie Admin</span>
      </div>

      <div class="topbar-right">
        <button class="topbar-icon-btn" type="button" aria-label="Notifications">
          🔔
        </button>

        <div class="topbar-user" id="topbarUser">
          <!-- inisial admin, nanti bisa diisi dari backend -->
          <div class="topbar-avatar" th:text="${adminInitials}">NI</div>
          <div class="topbar-user-text">
            <span class="topbar-user-name" th:text="${admin.fullName}">Najmi Hanif</span>
            <span class="topbar-user-role">Admin</span>
          </div>
          <span class="topbar-caret">▾</span>

          <div class="topbar-user-menu">
            <a th:href="@{/profile}" class="user-menu-item">
              <span class="user-menu-icon">👤</span>
              <span>Profile</span>
            </a>
            <a href="#" class="user-menu-item">
              <span class="user-menu-icon">⚙️</span>
              <span>Preferences</span>
            </a>
            <div class="user-menu-divider"></div>
            <a th:href="@{/logout}" class="user-menu-item logout">
              <span class="user-menu-icon">↩️</span>
              <span>Log out</span>
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- PROFILE CONTENT -->
    <section class="profile-section">
      <div class="page-header">
        <div>
          <h2 class="page-title">Profile</h2>
          <p class="page-subtitle">Kelola informasi akun admin Yoomie kamu.</p>
        </div>
      </div>

      <div class="profile-card">
        <!-- Bagian kiri: avatar & info singkat -->
        <div class="profile-left">
          <div class="profile-avatar" th:text="${adminInitials}">NH</div>
          <h3 class="profile-name" th:text="${admin.fullName}">Najmi Hanif</h3>
          <p class="profile-role">Admin</p>
          <p class="profile-email" th:text="${admin.email}">admin@tokoanda.com</p>
        </div>

        <!-- Bagian kanan: form (sementara untuk tampilan saja) -->
        <div class="profile-right">
          <!-- Untuk sekarang form ini hanya front-end,
               temanmu bisa nanti tambahkan th:action & POST -->
          <form class="profile-form">
            <div class="mb-3">
              <label class="form-label profile-label" for="fullName">Full Name</label>
              <input type="text"
                     id="fullName"
                     class="form-control profile-input"
                     placeholder="Your full name"
                     th:value="${admin.fullName}">
            </div>

            <div class="mb-3">
              <label class="form-label profile-label" for="adminName">Admin Name</label>
              <input type="text"
                     id="adminName"
                     class="form-control profile-input"
                     placeholder="Admin username"
                     th:value="${admin.adminName}">
            </div>

            <div class="mb-3">
              <label class="form-label profile-label" for="email">Email</label>
              <input type="email"
                     id="email"
                     class="form-control profile-input"
                     placeholder="admin@tokoanda.com"
                     th:value="${admin.email}">
            </div>

            <!-- nanti mau tambah "Change Password" bisa di bawah ini -->

            <div class="d-flex justify-content-end gap-2 mt-3">
              <a href="/A_dashboard" class="btn btn-outline-secondary">Cancel</a>
              <button type="button" class="btn btn-primary-soft">
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- pakai JS yang sama untuk dropdown user, dll -->
<script src="/js/A_dashboard.js"></script>
</body>
</html>
